services:
    - type: worker
    name: kavus-master-final
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
            - key: DERIV_TOKEN
        sync: false
            - key: TELEGRAM_TOKEN
        sync: false
            - key: TELEGRAM_CHAT_ID
        sync: false
            - key: RISK_PCT
        value: 1.0
            - key: SL_PIPS
        value: 100
            - key: RR
        value: 3.0
            - key: MULTIPLIER
        value: 500
            - key: ADX_MIN
        value: 18
            - key: RSI_MIN
        value: 30
            - key: RSI_MAX
        value: 70
            - key: AVOID_SWING
        value: True
            - key: VOL_FILTER
        value: True
            - key: MAX_SPREAD
        value: 20
